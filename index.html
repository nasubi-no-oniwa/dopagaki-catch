let AC=null,master=null,recDest=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(at,f,dur,type,vol,f2){const c=AC;if(!c)return null;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+dur);
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol||.3,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.02);return o;}
function noiseBuf(sec){const c=AC,n=c.sampleRate*sec|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let p=0;for(let i=0;i<n;i++){p=p*.96+(Math.random()*2-1)*.2;d[i]=p*2.2+(Math.random()*2-1)*.15;}return b;}
function noise(at,dur,f,q,vol){const c=AC;if(!c)return;const s=c.createBufferSource();s.buffer=noiseBuf(dur+.05);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;const g=c.createGain();
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(bp).connect(g).connect(master);s.start(at);s.stop(at+dur+.05);}
const SFX={
 whoosh(){if(!ac())return;const n=AC.currentTime;noise(n,.25,1800,1.2,.5);tone(n,300,.2,'triangle',.12,900);},
 catchAir(){if(!ac())return;const n=AC.currentTime;tone(n,1320,.12,'square',.18);tone(n+.05,1980,.25,'square',.14);noise(n,.12,3000,2,.4);},
 catchFall(){if(!ac())return;const n=AC.currentTime;noise(n,.1,900,1,.6);tone(n,660,.15,'triangle',.25);tone(n+.06,990,.2,'triangle',.2);},
 miss(){if(!ac())return;tone(AC.currentTime,240,.15,'sawtooth',.08,140);},
 thud(){if(!ac())return;const n=AC.currentTime;tone(n,120,.25,'sine',.5,50);noise(n,.15,400,1,.4);},
 bonk(){if(!ac())return;const n=AC.currentTime;tone(n,520,.12,'square',.2,260);tone(n+.08,180,.3,'sine',.4,70);},
 tick(at,hi){return tone(at,hi?1760:1046,hi?.35:.09,'sine',hi?.45:.32);},
 whoo(at,gain){const c=AC,o=c.createOscillator(),g=c.createGain();const f=1100+Math.random()*500;o.frequency.setValueAtTime(f*.8,at);o.frequency.linearRampToValueAtTime(f*1.25,at+.18);o.frequency.linearRampToValueAtTime(f*1.1,at+.5);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(gain,at+.05);g.gain.exponentialRampToValueAtTime(.0001,at+.55);o.connect(g).connect(master);o.start(at);o.stop(at+.6);},
 airhorn(at){const c=AC;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;const out=c.createGain();out.gain.value=.5;lp.connect(out).connect(master);
  [[0,.11],[.15,.11],[.3,.55]].forEach(([d,l])=>{[415,418,622,830].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f*.97,at+d);o.frequency.linearRampToValueAtTime(f,at+d+.04);
  const v=i<2?.09:.05;g.gain.setValueAtTime(.0001,at+d);g.gain.exponentialRampToValueAtTime(v,at+d+.015);g.gain.setValueAtTime(v,at+d+l-.03);g.gain.exponentialRampToValueAtTime(.0001,at+d+l);o.connect(g).connect(lp);o.start(at+d);o.stop(at+d+l+.02);});});},
 party(big){if(!ac())return;const n=AC.currentTime;SFX.airhorn(n+.02);[0,.2,.45,.7].forEach((d,i)=>SFX.whoo(n+d,.05));crowdSwell(big?.7:.5,big?1.6:1.0);if(big)SFX.airhorn(n+1.0);}
};
let crowd=null;
function startCrowd(){const c=ac();if(!c||crowd)return;const out=c.createGain();out.gain.value=0;out.connect(master);
 [[700,1.1,.29],[1150,1.4,.53],[2300,1.6,.87]].forEach(([f,q,lf],i)=>{const src=c.createBufferSource();src.buffer=noiseBuf(3+i*.7);src.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;const am=c.createGain();am.gain.value=.6;
  const l1=c.createOscillator(),g1=c.createGain();l1.frequency.value=lf;g1.gain.value=.25;l1.connect(g1).connect(am.gain);l1.start();src.connect(bp).connect(am).connect(out);src.start();});crowd={out};}
function crowdSwell(peak,hold){startCrowd();if(!crowd)return;const g=crowd.out.gain,n=AC.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(peak,n+.1);g.setValueAtTime(peak,n+.1+hold);g.linearRampToValueAtTime(0,n+.1+hold+1.6);}
function crowdOff(){if(crowd){const g=crowd.out.gain,n=AC.currentTime;g.cancelScheduledValues(n);g.setTargetAtTime(0,n,.1);}}
// 落ちてくるときの合図：ピッ・ピッ・ピッ・ポーン（ポーンで手に届く）。lat 秒だけ早めに鳴らす

function scheduleTicks(landPerf){

 const n=AC.currentTime,pn=performance.now();
 [[1.5,0],[1.0,0],[0.5,0],[0,1]].forEach(([b,hi])=>{const at=n+(landPerf-pn)/1000-b-lat;if(at>n+.01)ticks.push(SFX.tick(at,hi));});
}
function cancelTicks(){for(const o of ticks){try{o.stop()}catch(e){}}ticks=[];}

const tmpV=new THREE.Vector3(),tmpC=new THREE.Color();
function ballPos(s){
 const v=vel(s.p);
 if(s.tt==null)return null;
 const tt=s.tt;
 if(s.cat&&tt>=s.cat.e){
  if(s.cat.a===1){const by=yAt(v,s.cat.e),k=Math.min(1,Math.max(0,(tt-s.cat.e-.35)/.45)),ek=k*k*(3-2*k);return {x:0,y:by+(P.Y0-by)*ek,held:k>=1};}
  return {x:0,y:P.Y0,held:true};
 }
 let y=yAt(v,tt);
 if(s.drop&&y<P.R){ // 地面ではねる
  const tg=passDown(v,P.R),vg=v-P.G*tg;let u=tt-tg,vb=-vg*.45,yy=P.R;
  for(let i=0;i<4;i++){const tf=2*vb/P.G;if(u<tf){yy=P.R+vb*u-P.G*u*u/2;break;}u-=tf;vb*=.45;}
  return {x:0,y:yy,ground:true};
 }
 return {x:0,y};
}
function passDown(v,y){return (v+Math.sqrt(v*v-2*P.G*(y-P.Y0)))/P.G;}
let hist=[];
function setScene(s,dt){
 // 背景と盛り上がり
 const pl=s.pl||0;
 S.background.copy(WHITE).lerp(DARK,Math.min(1,pl*1.3));
 floor.material.opacity=1-Math.min(1,pl*1.5);
 party.visible=pl>.02;
 hemi.intensity=1.1-pl*.3+(s.strobe||0)*1.4;
 // 主役
 const m=me;resetMan(m);
 const tt=s.tt;

 if(tt==null){ // 持っている／力をためている
  const c=s.charge||0;
  m.hip.position.y=1-c*.28;m.legL.rotation.x=-c*.9;m.legR.rotation.x=-c*.9;m.root.position.z=0;m.hip.rotation.x=c*.25;

  m.armR.rotation.z=3.0-c*1.4;m.armR.rotation.x=-c*.4;m.armL.rotation.z=-.5-c*.4;
  m.neck.rotation.x=-.25+c*.15;
 }else{
  const air=bp&&!bp.held&&!bp.ground;
  m.armR.rotation.z=3.0;m.armL.rotation.z=-.4;
  if(air)m.neck.rotation.x=-.55;
  if(s.cat&&tt>=s.cat.e){ // 喜ぶ
   const k=tt-s.cat.e;const j=Math.abs(Math.sin(k*7))*.25*Math.min(1,pl*2);m.root.position.y=j;m.armL.rotation.z=-2.8;if(bp&&bp.held)m.armR.rotation.z=3.0;else m.armR.rotation.z=2.8;m.neck.rotation.x=-.2;
  }
  if(s.drop&&bp&&bp.ground){const k=Math.min(1,(tt-passDown(vel(s.p),P.R))/.5);m.hip.position.y=1-k*.45;m.hip.rotation.x=k*.6;m.armR.rotation.z=.3;m.armL.rotation.z=-.3;m.neck.rotation.x=k*.7;m.legL.rotation.x=-k*1.2;m.legR.rotation.x=-k*1.2;}
 }
 // ボール
 m.man.updateMatrixWorld(true);
 if(!bp){m.hand.getWorldPosition(tmpV);ball.position.set(tmpV.x+.02,tmpV.y+P.R*.85,0);}
 else ball.position.set(bp.x,bp.y,0);
 ball.visible=true;
 // 残像（速いときだけ）
 hist.unshift(ball.position.y);hist.length=6;
 const fast=tt!=null&&bp&&!bp.held&&!bp.ground&&Math.abs(vel(s.p)-P.G*tt)>6;
 ghosts.forEach((g,i)=>{const y=hist[i+1];g.visible=fast&&y!=null;if(g.visible)g.position.set(0,y,0);});
 // 押した場所
 if(s.tap&&tt!=null&&tt>=s.tap.e&&tt<s.tap.e+.8){tapRing.visible=true;tapRing.position.set(s.tap.x,s.tap.y,.25);const k=(tt-s.tap.e)/.8;tapRing.scale.setScalar(1+k*1.5);tapRing.material.opacity=1-k;tapRing.material.color.setHex(s.tap.ok?0x1aa34a:0x111111);}else tapRing.visible=false;
 if(s.cat&&tt>=s.cat.e&&tt<s.cat.e+.6){hitRing.visible=true;hitRing.position.copy(ball.position);hitRing.position.z=.22;const k=(tt-s.cat.e)/.6;hitRing.scale.setScalar(1+k*2.5);hitRing.material.opacity=1-k;}else hitRing.visible=false;
 shadow.material.opacity=.12*(1-pl);
 // パーティー
 if(party.visible){

  for(const c of crowdM){animCrowd(c,b,pl,dt||.016);c.root.position.y+=-2.5*(1-Math.min(1,pl*1.6));for(const gm of c.props)gm.color.setHSL(((T/4)+c.i*.13+c.row*.3)%1,1,.55);}
  let i=0;const bi=Math.floor(T*2.9);

function animCrowd(p,b,hype,dt){
 const q=b+p.ph*.15,s=Math.sin(q),s2=Math.sin(q*2);
 p.hip.position.set(0,1,0);p.hip.rotation.set(0,0,0);p.root.rotation.set(0,0,0);p.neck.rotation.set(0,0,0);p.man.rotation.y=0;for(const l of [p.armL,p.armR,p.legL,p.legR])l.rotation.set(0,0,0);
 switch(p.kind){
  case 'pogo':p.hip.position.y=1+Math.abs(s)*.28;p.armL.rotation.z=-2.7;p.armR.rotation.z=2.7;break;
  case 'wave':p.armL.rotation.z=-2.5+s*.5;p.armR.rotation.z=2.5+s*.5;p.hip.rotation.z=s*.12;break;
  case 'pump':{const up=s>0;p.armR.rotation.z=up?2.9:1.2;p.armL.rotation.z=-.5;p.hip.position.y=1+Math.abs(s)*.1;break;}
  case 'clap':{const c=Math.abs(s2);p.armL.rotation.z=-1.1+c*.85;p.armR.rotation.z=1.1-c*.85;p.armL.rotation.x=p.armR.rotation.x=-1.4;break;}
  case 'bang':p.neck.rotation.x=Math.abs(s2)*.8-.2;p.armR.rotation.z=2.6;p.armL.rotation.z=-.4;break;
 }
 if(hype>.5){p.armL.rotation.z=-2.9+Math.sin(q*4)*.2;p.armR.rotation.z=2.9+Math.sin(q*4+1)*.2;}
 if(p.jy===0&&p.jv===0&&Math.random()<dt*2*hype)p.jv=2.4+Math.random()*1.6;
 p.jv-=9.8*dt;p.jy=Math.max(0,p.jy+p.jv*dt);if(p.jy===0&&p.jv<0)p.jv=0;p.root.position.y=p.jy;
}

const fx=$('fx'),fg=fx.getContext('2d');let conf=[];
function fitFx(){fx.width=innerWidth*Math.min(devicePixelRatio,2);fx.height=innerHeight*Math.min(devicePixelRatio,2);}
function confetti(n){const W=fx.width,H=fx.height;for(let i=0;i<n;i++)conf.push({x:W*(.1+.8*Math.random()),y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*W*.4,vy:H*(.2+Math.random()*.5),r:Math.random()*6.28,vr:(Math.random()-.5)*12,s:(6+Math.random()*8)*Math.min(devicePixelRatio,2),c:['#ff3d6e','#ffcc33','#2ee6ff','#7dff4f','#b36bff','#fff'][i%6]});}
function drawConf(g,dt,W,H){for(const c of conf){c.vy+=H*.6*dt;c.vx*=.99;c.x+=c.vx*dt;c.y+=c.vy*dt*.6;c.r+=c.vr*dt;g.save();g.translate(c.x,c.y);g.rotate(c.r);g.fillStyle=c.c;g.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);g.restore();}conf=conf.filter(c=>c.y<H+40);}

function newThrow(){Object.assign(L,{tt:null,charge:0,p:0,relTs:0,chargeStart:0,cat:null,drop:false,tap:null,airTried:false,doneAt:0,ticket:null,dev:0,res:null,pointer:''});}
newThrow();
let active=null; // さわっている指（最初の1本だけ）
const pad=$('pad');
function toWorld(cx,cy){const r=cv.getBoundingClientRect();const v=new THREE.Vector3((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1,.5).unproject(cam);const d=v.sub(cam.position).normalize();const k=-cam.position.z/d.z;return {x:cam.position.x+d.x*k,y:cam.position.y+d.y*k};}
function powerAt(ts){const u=Math.max(0,(ts-L.chargeStart)/1000)/1.0;const f=u%2;return Math.round(1000*(f<1?f:2-f));}
// 時刻：ふつうはタップの時刻。おかしな値を出すブラウザでは今の時刻を使う
function evTs(e){const n=performance.now(),t=e.timeStamp;return (t>0&&Math.abs(t-n)<1000)?t:n;}
// 画面に映っていたボールの時刻：描いた時刻のうち、押した瞬間に画面に出ていたもの（描いてから映るまで1コマかかる）
const rafT=[];let frameD=1000/60;
function seenAt(ts){let best=null;for(const r of rafT){if(r<=ts-frameD&&(best==null||r>best))best=r;}return best==null?ts-frameD*2:best;}
const AIR_GRACE=.15; // ボールが消えた直後のこの秒数までは、空中キャッチをねらった押しとして扱う（外れても落球にしない）
pad.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(!e.isTrusted)return;               // 人の指・マウス以外（プログラムから送ったタップ）は無視
 if(active!==null)return;              // ほかの指がさわっている間は何も受けつけない
 active=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}
 ac();
 const ts=evTs(e);
 if(mode==='ready'){
  mode='charge';L.chargeStart=ts;L.pointer=e.pointerType;L.ticket=takeTicket();
  $('gauge').hidden=false;guide(t('release'));
  return;
 }
 if(mode!=='rise'&&mode!=='fall')return;
 const v=vel(L.p),rawE=(ts-L.relTs)/1000;
 if(rawE<=exitTime(v)+AIR_GRACE){
  // 空中キャッチをねらった押し（1回の投げにつき1回だけ）
  if(L.airTried)return;L.airTried=true;
  const w=toWorld(e.clientX,e.clientY);
  const eu=Math.max(1,Math.round((seenAt(ts)-L.relTs)*1000)); // 押したときに画面に映っていたボールの時刻（100万分の1秒）
  const x=Math.round(w.x*1e4),y=Math.round(w.y*1e4);
  const j=DPC.air(L.p,eu,x,y);
  if(j)L.tap={x:x/1e4,y:y/1e4,ok:true,e:Math.max(0,rawE)};
  if(j){L.dev=e.pointerType==='mouse'?1:0;caught({a:1,eu,x,y,...j});}
  // 外れたら何も起きない（空中で取れることを気づかせない）
  return;
 }
 // 落ちてくるボール：音に合わせる（押した時刻そのままで判定）
 const eu=Math.round((ts-L.relTs)*1000);
 const j=DPC.fall(L.p,eu);
 if(j){L.dev=e.pointerType==='mouse'?1:0;caught({a:0,eu,x:0,y:0,...j});}
 else{const tooEarly=eu/1e6<landTime(v);dropped(tooEarly?t('early'):t('late'));}
},{passive:false});
function upOrCancel(e,cancel){
 if(!e.isTrusted)return;
 if(e.pointerId!==active)return;active=null;
 if(mode==='charge'){
  if(cancel){mode='ready';$('gauge').hidden=true;guide(t('hold'));return;}
  const ts=evTs(e);L.p=powerAt(ts);L.relTs=ts;L.tt=0;mode='rise';$('gauge').hidden=true;guide(t('waitFall'));
  SFX.whoosh();scheduleTicks(ts+landTime(vel(L.p))*1000);
 }
}

// ===== 毎フレーム =====
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);if(now>last)frameD=Math.min(50,Math.max(6,frameD*.8+(now-last)*.2));last=now;clockT+=dt;
 rafT.push(now);if(rafT.length>12)rafT.shift();
 if(mode==='video'){requestAnimationFrame(frame);return;}
 let s;
 if(mode==='replay')s=replayState(now);
 else{
  if(mode==='charge'){L.charge=Math.min(1,(now-L.chargeStart)/250);const pw=powerAt(now);$('gaugeIn').style.height=(pw/10)+'%';}
  if(mode==='rise'||mode==='fall'||mode==='done')L.tt=(now-L.relTs)/1000;
  if(mode==='rise'&&L.tt>exitTime(vel(L.p))){mode='fall';guide(t('waitFall'));}
  if(mode==='fall'&&L.tt>landTime(vel(L.p))+P.WIN)dropped(t('late'));
  const target=(mode==='done'&&L.cat&&L.tt>=L.cat.e&&L.res&&L.res.k>=50)?(performance.now()-L.doneAt<4200?1:0):0;
  curPl+=(target-curPl)*Math.min(1,dt*(target>curPl?9:2));
  s={tt:(mode==='ready'||mode==='charge'||mode==='title')?null:L.tt,charge:mode==='charge'?L.charge:0,p:L.p,cat:L.cat,drop:L.drop,tap:L.tap,pl:curPl,T:clockT};
 }
 setScene(s,dt);
 R.render(S,cam);
 fg.clearRect(0,0,fx.width,fx.height);if(conf.length)drawConf(fg,dt,fx.width,fx.height);
 requestAnimationFrame(frame);
}

// 何投目か：サーバーが1ずつ数える（ゲームの側からはごまかせない）
let thrC=null;
async function getThrC(a){const g=await fetchR(DB('throws/'+a.uid+'/c.json?auth='+encodeURIComponent(a.token)));if(!g.ok)throw new Error('c '+g.status);const v=await g.json();return typeof v==='number'?v:0;}
function takeTicket(){
 return (async()=>{const a=await fbAuth();
  if(thrC==null)thrC=await getThrC(a);
  const put=()=>fetchR(DB('throws/'+a.uid+'.json?auth='+encodeURIComponent(a.token)),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:{'.sv':'timestamp'},c:thrC+1})});
  let r=await put();
  if(r.status===401||r.status===403){thrC=await getThrC(a);r=await put();} // ほかのタブで投げていた等で数がずれていたら合わせ直す
  if(!r.ok)throw new Error('ticket '+r.status);
  thrC++;const j=await r.json();let st=j&&j.t;
  if(typeof st!=='number'){const g=await fetchR(DB('throws/'+a.uid+'/t.json?auth='+encodeURIComponent(a.token)));st=await g.json();}
  return {st,c:thrC};
 })().catch(e=>{console.warn(e);thrC=null;return null;});
}
let sendState={};
async function submit(r){
 const board=L.dev?'pc':'sp';
 const prev=bestL[board];
 r.newBest=!prev||r.q<prev.q||(r.q===prev.q&&r.k>prev.k);
 if(r.newBest){bestL[board]={q:r.q,k:r.k};ls.set('dpc_best',bestL);}
 sendState={msg:'',cls:'',need:false};
 const rec={a:r.a,p:L.p,eu:r.eu,x:r.x,y:r.y,q:r.q,k:r.k};
 L.sendRec={rec,board,ticket:L.ticket};
 L.ticket.then(tk=>{if(tk&&L.res===r){r.c=tk.c;if(!$('result').hidden&&lastShown===r)$('rBest').innerHTML=t('nth',{c:tk.c})+'<br>'+(r.newBest?'<b style="color:var(--ok)">'+t('newbest')+'</b>':'')+(L.dev?'<br>'+t('pcNote'):'');}});
 const name=ls.get('dpc_name','');
 if(!name){sendState.need=true;return;}
 await doSend(name);
}
async function doSend(name){
 const S0=L.sendRec;if(!S0)return;const {rec,board}=S0;
 const setMsg=(m,c)=>{sendState.msg=m;sendState.cls=c;if(!$('result').hidden){$('sendMsg').textContent=m;$('sendMsg').className='note '+c;}};
 setMsg(t('sending'),'');
 try{
  const tk=await S0.ticket;if(!tk){setMsg(t('noticket'),'err');return;}
  const a=await fbAuth();
  const cur=await fetchR(DB(board+'/scores/'+a.uid+'.json')).then(x=>x.ok?x.json():null).catch(()=>null);
  if(cur&&(cur.q<rec.q||(cur.q===rec.q&&cur.k>=rec.k))){setMsg(t('notbetter'),'');sendState.need=false;return;}
  const body={n:name,...rec,st:tk.st,c:tk.c,t:{'.sv':'timestamp'},v:P.V};
  const put=()=>fetchR(DB(board+'/scores/'+a.uid+'.json?auth='+encodeURIComponent(a.token)),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let res=await put();
  if(res.status===401||res.status===403){await new Promise(r=>setTimeout(r,1800));res=await put();}
  if(res.status===401||res.status===403){setMsg(t('noticket'),'err');sendState.need=false;$('sendBtn').hidden=true;return;}
  if(!res.ok)throw new Error('put '+res.status);
  L.sendRec=null;sendState.need=false;$('sendBtn').hidden=true;$('rName').hidden=true;
  const rk=await myRank(board,a.uid);setMsg(t('sent',{r:rk||'?'}),'ok');
 }catch(e){console.warn(e);sendState.need=true;setMsg(t('senderr'),'err');if(!$('result').hidden){$('sendBtn').hidden=false;$('sendBtn').disabled=false;$('rName').hidden=false;}}
}
$('sendBtn').onclick=async()=>{
 const n=$('rName').value.trim();const m=$('sendMsg');
 if(!n){m.textContent=t('needname');m.className='note err';return;}
 if(badName(n)){m.textContent=t('badname');m.className='note err';return;}
 ls.set('dpc_name',n);$('sendBtn').disabled=true;await doSend(n);$('sendBtn').disabled=false;
};
$('nameIn').addEventListener('change',()=>{const n=$('nameIn').value.trim();if(n&&badName(n)){$('nameIn').value='';return;}ls.set('dpc_name',n);});
async function loadBoard(board){
 const [d,h]=await Promise.all([fetch(DB(board+'/scores.json?orderBy=%22q%22&limitToFirst=300')).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch(DB('hidden.json')).then(r=>r.ok?r.json():null).catch(()=>null)]);
 return Object.entries(d||{}).map(([id,v])=>({...v,id})).filter(r=>!(h&&h[r.id])&&DPC.check(r)).sort((a,b)=>a.q-b.q||b.k-a.k||a.t-b.t);
}
async function myRank(board,uid){try{const rows=await loadBoard(board);const i=rows.findIndex(r=>r.id===uid);return i>=0?i+1:null;}catch(e){return null;}}
let rankFrom=false,rankRows=[],curBoard='sp';
async function openRank(board,fromResult){
 rankFrom=!!fromResult;curBoard=board;show('rankPanel');$('tabSp').classList.toggle('on',board==='sp');$('tabPc').classList.toggle('on',board==='pc');
 const box=$('rankBox');box.innerHTML='<p>'+t('loading')+'</p>';
 try{
  const rows=await loadBoard(board);rankRows=rows;const myId=(ls.get('dpc_auth',null)||{}).uid;
  if(!rows.length){box.innerHTML='<p>'+t('empty')+'</p>';return;}
  box.innerHTML='<table class="rank">'+rows.slice(0,100).map((r,i)=>'<tr'+(r.id===myId?' class="me"':'')+'><td class="r">'+(i+1)+'</td><td class="n">'+esc(r.n)+'</td><td class="c">'+fmtT(r.q)+'</td><td class="s">'+r.k+t('pt')+(r.a===1?'':'↓')+(r.c?'<br>'+t('nth',{c:r.c}):'')+'</td><td class="p"><button data-i="'+i+'">▶</button></td></tr>').join('')+'</table>';
 }catch(e){box.innerHTML='<p>'+t('rankerr')+'</p>';}
}
$('tabSp').onclick=()=>openRank('sp',rankFrom);$('tabPc').onclick=()=>openRank('pc',rankFrom);
$('rankBox').onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;startReplay(rankRows[+b.dataset.i]);};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== 上位の投げ方を再生 =====
let RP=null;
function recState(rec,tt,T){
 // tt：投げてからの秒（マイナスは力をためている間）
 const e=rec.eu/1e6;
 const charge=tt<0?Math.min(1,(tt+.7)/.25):0;
 const pl=(tt>=e&&rec.k>=50)?Math.min(1,(tt-e)*6)*(tt<e+3.2?1:Math.max(0,1-(tt-e-3.2)*2)):0;
 return {tt:tt<0?null:tt,charge:Math.max(0,charge),p:rec.p,cat:{e,a:rec.a,x:rec.x,y:rec.y},drop:false,tap:rec.a===1?{x:rec.x/1e4,y:rec.y/1e4,ok:true,e}:null,pl,T};
}
function startReplay(rec){
 if(!rec)return;show(null);mode='replay';$('replayBar').hidden=false;$('replayTxt').textContent=t('replaying',{n:rec.n})+'  '+fmtT(rec.q)+t('sec');
 RP={rec,t0:performance.now(),slow:false};guide('');
}
function replayState(now){
 const rec=RP.rec,e=rec.eu/1e6;
 // ふつうの速さ → スローでもう1回
 const a=(now-RP.t0)/1000,n1=.8+e+1.6;
 let tt;
 if(a<n1)tt=a-.8;
 else{const sf=slowFactor(rec),from=slowFrom(rec),len=(e+.15-from)*sf;const b=a-n1;if(b<len)tt=from+b/sf;else{tt=e+.15;if(b>len+1.2){RP.t0=now;}}}
 return recState(rec,tt,clockT);
}
function slowFactor(rec){const e=rec.eu/1e6;return rec.a===1?Math.min(10,2.6/(e+.2)):6;}
function slowFrom(rec){const e=rec.eu/1e6;return rec.a===1?-.05:e-.35;}
$('replayBack').onclick=()=>{$('replayBar').hidden=true;mode='title';curPl=0;openRank(curBoard,rankFrom);};

// ===== 動画（記録から作り直す。ふつう → スロー） =====
let vidBlob=null,vidExt='mp4';
$('vidBtn').onclick=()=>makeVideo(lastShown);
$('vBack').onclick=()=>show('result');
async function makeVideo(r){
 if(!r)return;
 const can=document.createElement('canvas');const VW=540,VH=960;can.width=VW;can.height=VH;
 if(!can.captureStream||!window.MediaRecorder){show('vidPanel');$('vMsg').textContent=t('vfail');return;}
 show(null);mode='video';$('recBadge').hidden=false;$('recBadge').textContent='● '+t('making');
 const g=can.getContext('2d');
 const VR=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});VR.setSize(VW,VH,false);VR.setPixelRatio(1);
 const vcam=cam.clone();vcam.aspect=VW/VH;vcam.updateProjectionMatrix();
 const oldAspect=cam.aspect;cam.aspect=VW/VH;cam.updateProjectionMatrix();placeCrowd();
 ac();const dest=AC.createMediaStreamDestination();master.connect(dest);
 const stream=can.captureStream(30);dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
 const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc3,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const mime=types.find(x=>{try{return MediaRecorder.isTypeSupported(x)}catch(e){return false}})||'';
 vidExt=mime.includes('mp4')?'mp4':'webm';
 let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{});}catch(e){finish(null);return;}
 const chunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
 const R0=r;
 const e=r.eu/1e6,sf=slowFactor(R0),from=slowFrom(R0),slowLen=(e+.15-from)*sf;
 const PRE=.7,N1=PRE+e+1.7,TOT=N1+slowLen+1.6;
 let partyFired=false,fx2=[];
 setScene(recState(R0,-.8,0),.016);VR.compile(S,vcam);VR.render(S,vcam);g.drawImage(VR.domElement,0,0,VW,VH);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 const done=new Promise(res=>{rec.onstop=res;});
 rec.start(200);
 const t0=performance.now();let lastF=t0,clk=0;
 await new Promise(resolve=>{
  function step(now){
   const a=(now-t0)/1000,dt=Math.min(.05,(now-lastF)/1000);lastF=now;clk+=dt;
   let tt,slow=false,end=false;
   if(a<N1)tt=a-PRE;else if(a<N1+slowLen){tt=from+(a-N1)/sf;slow=true;}else{tt=e+.15;end=a>N1+slowLen+.2;}
   if(!partyFired&&!slow&&tt>=e){partyFired=true;(r.a===1?SFX.catchAir:SFX.catchFall)();if(r.k>=50)setTimeout(()=>SFX.party(r.k>=95),r.a===1?200:50);
    if(r.k>=50)for(let i=0;i<180;i++)fx2.push({x:VW*(.1+.8*Math.random()),y:-20-Math.random()*VH*.3,vx:(Math.random()-.5)*VW*.4,vy:VH*(.2+Math.random()*.5),r:Math.random()*6.28,vr:(Math.random()-.5)*12,s:10+Math.random()*10,c:['#ff3d6e','#ffcc33','#2ee6ff','#7dff4f','#b36bff','#fff'][i%6]});}
   if(!slow&&a>=N1-.01&&a<N1+.05)SFX.whoosh();
   const s=recState(R0,tt,clk);if(end&&r.k>=50)s.pl=1;
   setScene(s,dt);VR.render(S,vcam);
   g.drawImage(VR.domElement,0,0,VW,VH);
   // 紙ふぶき
   for(const c of fx2){c.vy+=VH*.6*dt;c.x+=c.vx*dt;c.y+=c.vy*dt*.6;c.r+=c.vr*dt;g.save();g.translate(c.x,c.y);g.rotate(c.r);g.fillStyle=c.c;g.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);g.restore();}
   fx2=fx2.filter(c=>c.y<VH+40);
   // 文字
   const dark=s.pl>.4;g.textAlign='center';g.lineJoin='round';g.lineWidth=8;g.strokeStyle=dark?'#000a':'#fffd';
   const txt=(str,x,y)=>{g.strokeText(str,x,y);g.fillText(str,x,y);};
   g.fillStyle=dark?'#fff':'#111';g.font='900 30px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(t('hud'),VW/2,56);
   if(slow){g.fillStyle='#ff3d6e';g.font='900 36px system-ui,sans-serif';txt('SLOW ×'+(Math.round(sf*10)/10),VW/2,108);}
   if(tt>=e||end){
    g.fillStyle=dark?'#ffcc33':'#ff3d6e';g.font='900 84px system-ui,sans-serif';txt(fmtT(r.q),VW/2,VH-225);
    g.fillStyle=dark?'#fff':'#111';g.font='900 33px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt((r.a===1?t('air'):t('fall'))+'  '+r.k+t('pt')+'「'+evName(r.k)+'」',VW/2,VH-165);
   }
   g.fillStyle=dark?'#fffc':'#0009';g.font='700 22px system-ui,sans-serif';txt(GAME_URL.replace('https://',''),VW/2,VH-45);
   if(a<TOT)requestAnimationFrame(step);else resolve();
  }
  requestAnimationFrame(step);
 });
 rec.stop();await done;
 try{master.disconnect(dest);}catch(_){}
 VR.dispose();cam.aspect=oldAspect;cam.updateProjectionMatrix();placeCrowd();
 finish(new Blob(chunks,{type:(mime||'video/webm').split(';')[0]}));
 function finish(blob){
  $('recBadge').hidden=true;mode='done';curPl=0;show('vidPanel');vidBlob=blob;
  if(!blob||!blob.size){$('vMsg').textContent=t('vfail');$('vShare').hidden=true;$('vSave').hidden=true;return;}
  const url=URL.createObjectURL(blob);$('vidPrev').src=url;$('vidPrev').play().catch(()=>{});
  const file=new File([blob],'dopagaki.'+vidExt,{type:blob.type});
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $('vShare').hidden=!canShare;$('vSave').hidden=false;
  $('vMsg').textContent=canShare?t('vmade'):t('shareHint');
  $('vShare').onclick=async()=>{try{await navigator.share({files:[file],text:postText(r)+'\n'+GAME_URL});}catch(e){}};
  $('vSave').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='dopagaki_'+fmtT(r.q)+'.'+vidExt;document.body.appendChild(a);a.click();a.remove();};
 }
}

// ===== 音のずれ調整 =====
function latShow(){$('lNow').textContent=t('lNow',{v:(lat>=0?'':'−')+Math.abs(lat).toFixed(2)});}
$('latBtn').onclick=()=>{show('latPanel');$('lMsg').textContent='';$('latDots').innerHTML='<i></i>'.repeat(8);latShow();};
$('lBack').onclick=showTitle;
$('lReset').onclick=()=>{lat=0;ls.set('dpc_lat',0);latShow();};
$('lMinus').onclick=()=>{lat=Math.round((lat-.01)*100)/100;ls.set('dpc_lat',lat);latShow();};
$('lPlus').onclick=()=>{lat=Math.round((lat+.01)*100)/100;ls.set('dpc_lat',lat);latShow();};
let latRun=null;
$('lStart').onclick=()=>{
 if(!ac())return;const n=AC.currentTime+1.0,pn=performance.now()+1000;
 latRun={beats:[],taps:[]};
 for(let i=0;i<10;i++){SFX.tick(n+i*.9,1);latRun.beats.push(pn+i*900);}
 $('latDots').innerHTML='<i></i>'.repeat(8);$('lMsg').textContent='';
 setTimeout(()=>{if(!latRun)return;const d=latRun.taps.slice().sort((a,b)=>a-b);
  if(d.length<6){$('lMsg').textContent=t('lAgain');latRun=null;return;}
  const med=d[Math.floor(d.length/2)];lat=Math.max(-.1,Math.min(.6,Math.round(med/10)/100));ls.set('dpc_lat',lat);latShow();$('lMsg').textContent=t('lDone');latRun=null;},1000+10*900+400);
};
$('latBig').addEventListener('pointerdown',e=>{
 e.preventDefault();const b=$('latBig');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),90);
 if(!latRun)return;const ts=e.timeStamp;let best=null;for(const bt of latRun.beats){const d=ts-bt;if(d>-300&&d<700&&(best==null||Math.abs(d)<Math.abs(best)))best=d;}
 if(best==null)return;latRun.taps.push(best);const dots=$('latDots').children;if(latRun.taps.length<=8&&dots[latRun.taps.length-1])dots[latRun.taps.length-1].classList.add('on');
});

// ===== はじめ =====
fit();applyLang();showTitle();party.visible=true;try{R.compile(S,cam);}catch(e){}requestAnimationFrame(frame);
window.__dpc={L,get mode(){return mode},toWorld,cam,DPC,seenAt};
